<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Super Retro Platformer - 2D Side-Scroller</title>
    <meta name="description" content="A classic side-scrolling 2D platformer game inspired by Super Mario Bros featuring smooth physics, powerups, enemies, and authentic retro visuals." />
    <meta property="og:title" content="Super Retro Platformer - 2D Side-Scroller" />
    <meta property="og:description" content="A classic side-scrolling 2D platformer game inspired by Super Mario Bros featuring smooth physics, powerups, enemies, and authentic retro visuals." />
    <meta property="og:type" content="website" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        background: #0f111a;
        color: #fff;
        font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        touch-action: none;
      }

      #game-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 1000px;
        max-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.9);
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #222639;
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #5c94fc;
      }

      /* Mobile / Touch Controller */
      #touch-controls {
        position: absolute;
        bottom: 12px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
        pointer-events: none;
        z-index: 50;
      }

      .touch-group {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }

      .touch-btn {
        width: 58px;
        height: 58px;
        background: rgba(20, 24, 38, 0.72);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        color: #fff;
        font-family: monospace;
        font-size: 20px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        active: scale(0.92);
        touch-action: manipulation;
      }

      .touch-btn:active, .touch-btn.active {
        background: rgba(252, 152, 56, 0.85);
        border-color: #fff;
        transform: scale(0.93);
      }

      .touch-btn-action {
        background: rgba(220, 40, 40, 0.75);
      }

      .touch-btn-jump {
        background: rgba(40, 180, 40, 0.75);
      }

      /* Quick top toolbar for mute and restart */
      #top-bar {
        position: absolute;
        top: 8px;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 60;
      }

      .icon-btn {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        padding: 6px 10px;
        font-size: 13px;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }

      .icon-btn:hover {
        background: rgba(252, 152, 56, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="800" height="480"></canvas>

      <div id="top-bar">
        <select id="stage-select" class="icon-btn" title="Select Stage" style="background: rgba(0, 0, 0, 0.75); cursor: pointer; color: #ffd700; font-weight: bold;">
          <option value="1">STAGE 1: OVERWORLD</option>
          <option value="2">STAGE 2: UNDERGROUND</option>
          <option value="3">STAGE 3: CASTLE</option>
        </select>
        <button id="btn-sound" class="icon-btn" title="Toggle Sound">🔊 SOUND: ON</button>
        <button id="btn-restart" class="icon-btn" title="Reset Level">🔄 RESTART</button>
      </div>

      <div id="touch-controls">
        <div class="touch-group">
          <button id="btn-left" class="touch-btn" aria-label="Left">◀</button>
          <button id="btn-right" class="touch-btn" aria-label="Right">▶</button>
        </div>
        <div class="touch-group">
          <button id="btn-run" class="touch-btn touch-btn-action" aria-label="Run">B</button>
          <button id="btn-jump" class="touch-btn touch-btn-jump" aria-label="Jump">A</button>
        </div>
      </div>
    </div>

    <script>
      (function() {
        'use strict';

        // --- RETRO SOUND SYNTHESIZER (Web Audio API) ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              audioCtx = new AudioContext();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }

        function playTone(freq, type, duration, rampTo = null, delay = 0) {
          if (!soundEnabled || !audioCtx) return;
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime + delay;

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (rampTo !== null) {
              osc.frequency.exponentialRampToValueAtTime(Math.max(10, rampTo), now + duration);
            }

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration);
          } catch(e) {}
        }

        const Sound = {
          jump: function() {
            playTone(150, 'square', 0.16, 580);
          },
          doubleJump: function() {
            playTone(320, 'square', 0.12, 750, 0);
            playTone(560, 'square', 0.18, 980, 0.05);
          },
          stomp: function() {
            playTone(280, 'triangle', 0.14, 60);
          },
          coin: function() {
            playTone(987.77, 'sine', 0.08, null, 0); // B5
            playTone(1318.51, 'sine', 0.28, null, 0.08); // E6
          },
          bump: function() {
            playTone(120, 'square', 0.1, 50);
          },
          powerupAppear: function() {
            const notes = [330, 392, 493, 587, 659];
            notes.forEach((f, i) => playTone(f, 'triangle', 0.08, null, i * 0.06));
          },
          powerup: function() {
            const notes = [330, 392, 659, 523, 587, 784];
            notes.forEach((f, i) => playTone(f, 'square', 0.09, null, i * 0.07));
          },
          breakBrick: function() {
            playTone(240, 'sawtooth', 0.15, 40);
          },
          shrink: function() {
            const notes = [784, 587, 523, 392, 330];
            notes.forEach((f, i) => playTone(f, 'triangle', 0.09, null, i * 0.07));
          },
          die: function() {
            const melody = [500, 450, 400, 350, 250, 180];
            melody.forEach((f, i) => playTone(f, 'sawtooth', 0.18, null, i * 0.13));
          },
          victory: function() {
            const fanfare = [
              { f: 392, d: 0.15, t: 0 },
              { f: 523, d: 0.15, t: 0.16 },
              { f: 659, d: 0.15, t: 0.32 },
              { f: 784, d: 0.22, t: 0.48 },
              { f: 659, d: 0.15, t: 0.72 },
              { f: 784, d: 0.45, t: 0.90 }
            ];
            fanfare.forEach(n => playTone(n.f, 'square', n.d, null, n.t));
          },
          stageClear: function() {
            const fanfare = [
              { f: 523.25, d: 0.12, t: 0 },
              { f: 659.25, d: 0.12, t: 0.12 },
              { f: 783.99, d: 0.12, t: 0.24 },
              { f: 1046.5, d: 0.25, t: 0.36 },
              { f: 880.00, d: 0.15, t: 0.62 },
              { f: 1046.5, d: 0.40, t: 0.80 }
            ];
            fanfare.forEach(n => playTone(n.f, 'square', n.d, null, n.t));
          },
          lava: function() {
            playTone(80, 'sawtooth', 0.25, 30);
          },
          bossRoar: function() {
            playTone(110, 'sawtooth', 0.35, 45);
          }
        };

        // --- RETRO CHIPTUNE BACKGROUND MUSIC ENGINE ---
        let bgmNoteIndex = 0;
        let bgmTimer = 0;

        // Stage 1 (Overworld bouncy melody)
        const bgmOverworld = [
          { f: 659.25, d: 0.11 }, { f: 659.25, d: 0.11 }, { f: 0, d: 0.11 }, { f: 659.25, d: 0.11 },
          { f: 0, d: 0.11 }, { f: 523.25, d: 0.11 }, { f: 659.25, d: 0.16 }, { f: 0, d: 0.11 },
          { f: 783.99, d: 0.18 }, { f: 0, d: 0.22 }, { f: 392.00, d: 0.18 }, { f: 0, d: 0.22 },
          { f: 523.25, d: 0.15 }, { f: 0, d: 0.11 }, { f: 392.00, d: 0.15 }, { f: 0, d: 0.11 },
          { f: 329.63, d: 0.15 }, { f: 0, d: 0.11 }, { f: 440.00, d: 0.15 }, { f: 493.88, d: 0.15 },
          { f: 466.16, d: 0.11 }, { f: 440.00, d: 0.15 }, { f: 392.00, d: 0.18 }
        ];

        // Stage 2 (Underground classic bass groove)
        const bgmUnderground = [
          { f: 130.81, d: 0.12 }, { f: 261.63, d: 0.12 }, { f: 220.00, d: 0.12 }, { f: 440.00, d: 0.12 },
          { f: 233.08, d: 0.12 }, { f: 466.16, d: 0.12 }, { f: 0, d: 0.16 },
          { f: 130.81, d: 0.12 }, { f: 261.63, d: 0.12 }, { f: 220.00, d: 0.12 }, { f: 440.00, d: 0.12 },
          { f: 233.08, d: 0.12 }, { f: 466.16, d: 0.12 }, { f: 0, d: 0.20 }
        ];

        // Stage 3 (Castle dramatic tense arpeggios)
        const bgmCastle = [
          { f: 220.00, d: 0.11 }, { f: 261.63, d: 0.11 }, { f: 329.63, d: 0.11 }, { f: 440.00, d: 0.11 },
          { f: 415.30, d: 0.11 }, { f: 329.63, d: 0.11 }, { f: 261.63, d: 0.11 }, { f: 220.00, d: 0.11 },
          { f: 196.00, d: 0.11 }, { f: 246.94, d: 0.11 }, { f: 293.66, d: 0.11 }, { f: 392.00, d: 0.11 },
          { f: 369.99, d: 0.11 }, { f: 293.66, d: 0.11 }, { f: 246.94, d: 0.11 }, { f: 196.00, d: 0.11 }
        ];

        function updateBGM(dt) {
          if (!soundEnabled || !audioCtx || currentState !== GameState.PLAYING) return;
          const currentTrack = currentStage === 2 ? bgmUnderground : (currentStage === 3 ? bgmCastle : bgmOverworld);
          bgmTimer -= dt;
          if (bgmTimer <= 0) {
            const note = currentTrack[bgmNoteIndex];
            if (note.f > 0) {
              playTone(note.f, currentStage === 2 ? 'triangle' : 'square', note.d);
            }
            bgmTimer = note.d + 0.04;
            bgmNoteIndex = (bgmNoteIndex + 1) % currentTrack.length;
          }
        }

        // --- CANVAS SETUP ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const VIEW_WIDTH = 800;
        const VIEW_HEIGHT = 480;
        const TILE_SIZE = 32;
        const GRAVITY = 1200;

        // --- GAME STATE ---
        const GameState = {
          START: 'START',
          STAGE_CARD: 'STAGE_CARD',
          PLAYING: 'PLAYING',
          PAUSED: 'PAUSED',
          DYING: 'DYING',
          GAMEOVER: 'GAMEOVER',
          VICTORY_SLIDE: 'VICTORY_SLIDE',
          VICTORY_WALK: 'VICTORY_WALK',
          VICTORY: 'VICTORY'
        };

        let currentStage = 1;
        const TOTAL_STAGES = 3;
        let stageCardTimer = 0;
        const STAGE_NAMES = {
          1: { num: '1-1', title: 'OVERWORLD GRASSLAND' },
          2: { num: '1-2', title: 'UNDERGROUND CAVERN' },
          3: { num: '1-3', title: "BOWSER'S LAVA CASTLE" }
        };

        let currentState = GameState.START;
        let score = 0;
        let coins = 0;
        let lives = 3;
        let levelTime = 400;
        let timeTimer = 0;
        let highScore = parseInt(localStorage.getItem('retro_mario_highscore') || '0', 10);
        let cameraX = 0;
        let victoryTimer = 0;
        let victoryBonusCalculated = false;

        // --- CONTROLS INPUT ---
        const keys = {
          left: false,
          right: false,
          jump: false,
          jumpHeld: false,
          run: false
        };

        window.addEventListener('keydown', (e) => {
          initAudio();
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
            e.preventDefault();
          }

          if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
          if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
          if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space' || e.code === 'KeyZ') {
            if (!keys.jumpHeld) {
              keys.jump = true;
            }
            keys.jumpHeld = true;
          }
          if (e.shiftKey || e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
            keys.run = true;
          }

          if (e.code === 'KeyP' || e.code === 'Escape') {
            if (currentState === GameState.PLAYING) currentState = GameState.PAUSED;
            else if (currentState === GameState.PAUSED) currentState = GameState.PLAYING;
          }

          if (e.code === 'KeyR') {
            resetGame(true);
          }

          // Screen transition trigger with Space/Enter
          if (e.code === 'Space' || e.code === 'Enter') {
            if (currentState === GameState.START) {
              startGame();
            } else if (currentState === GameState.GAMEOVER) {
              resetGame(true);
              startGame();
            } else if (currentState === GameState.VICTORY) {
              resetGame(true);
              startGame();
            }
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
          if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
          if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space' || e.code === 'KeyZ') {
            keys.jump = false;
            keys.jumpHeld = false;
          }
          if (!e.shiftKey && (e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight')) {
            keys.run = false;
          }
        });

        // Touch Control Listeners
        function setupTouchBtn(id, keyProp) {
          const btn = document.getElementById(id);
          if (!btn) return;
          const setKey = (val) => {
            initAudio();
            if (keyProp === 'jump') {
              if (val && !keys.jumpHeld) keys.jump = true;
              keys.jumpHeld = val;
            } else {
              keys[keyProp] = val;
            }
            if (val) btn.classList.add('active');
            else btn.classList.remove('active');
          };

          btn.addEventListener('touchstart', (e) => { e.preventDefault(); setKey(true); });
          btn.addEventListener('touchend', (e) => { e.preventDefault(); setKey(false); });
          btn.addEventListener('mousedown', (e) => { e.preventDefault(); setKey(true); });
          btn.addEventListener('mouseup', (e) => { e.preventDefault(); setKey(false); });
          btn.addEventListener('mouseleave', () => setKey(false));
        }

        setupTouchBtn('btn-left', 'left');
        setupTouchBtn('btn-right', 'right');
        setupTouchBtn('btn-jump', 'jump');
        setupTouchBtn('btn-run', 'run');

        // Top buttons
        const soundBtn = document.getElementById('btn-sound');
        soundBtn.addEventListener('click', () => {
          initAudio();
          soundEnabled = !soundEnabled;
          soundBtn.textContent = soundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
        });

        const restartBtn = document.getElementById('btn-restart');
        restartBtn.addEventListener('click', () => {
          initAudio();
          resetGame(true);
        });

        const stageSelectElem = document.getElementById('stage-select');
        if (stageSelectElem) {
          stageSelectElem.addEventListener('change', (e) => {
            initAudio();
            const chosen = parseInt(e.target.value, 10);
            startStage(chosen);
          });
        }

        // Click canvas to start / restart
        canvas.addEventListener('pointerdown', () => {
          initAudio();
          if (currentState === GameState.START) {
            startGame();
          } else if (currentState === GameState.GAMEOVER || currentState === GameState.VICTORY) {
            resetGame(true);
            startGame();
          }
        });

        // --- GAME ENTITIES & STRUCTURES ---
        let player;
        let blocks = [];
        let enemies = [];
        let items = [];
        let coinsList = [];
        let particles = [];
        let floatingTexts = [];
        let bossFireballs = [];
        let skyBirds = [];
        let skyPlanes = [];
        let bowser = null;
        let axeBlock = null;
        let flagpole = null;
        let castle = null;

        const LEVEL_WIDTH = 3400;
        const GROUND_Y = 416; // Top of ground blocks

        class Player {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.w = 24;
            this.h = 30; // Small form height
            this.vx = 0;
            this.vy = 0;
            this.isGrounded = false;
            this.facing = 1; // 1 = right, -1 = left
            this.isSuper = false;
            this.invincibleTimer = 0;
            this.animTimer = 0;
            this.walkFrame = 0;
            this.skidding = false;
            this.dyingTimer = 0;
            this.growthTimer = 0;
            this.jumpCount = 0;
            this.maxJumps = 2;
            this.spinAngle = 0;
            this.isSpinning = false;
          }

          reset(x, y) {
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.isGrounded = false;
            this.facing = 1;
            this.isSuper = false;
            this.w = 24;
            this.h = 30;
            this.invincibleTimer = 2; // brief spawn shield
            this.animTimer = 0;
            this.walkFrame = 0;
            this.skidding = false;
            this.dyingTimer = 0;
            this.growthTimer = 0;
            this.jumpCount = 0;
            this.maxJumps = 2;
            this.spinAngle = 0;
            this.isSpinning = false;
          }

          makeSuper() {
            if (!this.isSuper) {
              this.isSuper = true;
              this.y -= 22;
              this.h = 52;
              this.growthTimer = 0.5;
              this.invincibleTimer = 1.0;
              Sound.powerup();
              addFloatingText(this.x + 8, this.y, '1000', '#ffff55');
              score += 1000;
            }
          }

          takeDamage() {
            if (this.invincibleTimer > 0) return;
            if (this.isSuper) {
              this.isSuper = false;
              this.h = 30;
              this.y += 22;
              this.invincibleTimer = 2.5; // Flash invulnerability
              Sound.shrink();
              this.vy = -200; // Small hop
            } else {
              this.die();
            }
          }

          die() {
            currentState = GameState.DYING;
            this.dyingTimer = 2.4;
            this.vy = -460;
            this.vx = 0;
            Sound.die();
            lives--;
          }

          update(dt) {
            if (this.invincibleTimer > 0) {
              this.invincibleTimer -= dt;
            }
            if (this.growthTimer > 0) {
              this.growthTimer -= dt;
            }

            // Horizontal Movement & Acceleration
            const accel = keys.run ? 1100 : 750;
            const maxSpeed = keys.run ? 280 : 190;
            const friction = this.isGrounded ? 900 : 350;

            if (keys.left) {
              if (this.vx > 30) this.skidding = true;
              else this.skidding = false;
              this.vx -= accel * dt;
              this.facing = -1;
            } else if (keys.right) {
              if (this.vx < -30) this.skidding = true;
              else this.skidding = false;
              this.vx += accel * dt;
              this.facing = 1;
            } else {
              this.skidding = false;
              if (this.vx > 0) {
                this.vx = Math.max(0, this.vx - friction * dt);
              } else if (this.vx < 0) {
                this.vx = Math.min(0, this.vx + friction * dt);
              }
            }

            this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

            // Spin animation for double jump
            if (this.isSpinning) {
              this.spinAngle += dt * 18;
              if (this.spinAngle >= Math.PI * 2) {
                this.spinAngle = 0;
                this.isSpinning = false;
              }
            }

            // Jump handling (Ground Jump & Double Jump on double tap)
            if (keys.jump) {
              if (this.isGrounded) {
                // High Jump: gives an extra launch boost if running/sprinting!
                const isSprinting = keys.run && Math.abs(this.vx) > 100;
                this.vy = isSprinting ? -620 : -570;
                this.isGrounded = false;
                this.jumpCount = 1;
                Sound.jump();
                keys.jump = false; // consume trigger
                // Spawn landing/jump dust
                createDust(this.x + this.w / 2, this.y + this.h);
              } else if (this.jumpCount < this.maxJumps) {
                // High Double Jump in mid-air!
                this.vy = -590;
                this.jumpCount = 2;
                this.isSpinning = true;
                this.spinAngle = 0;
                Sound.doubleJump();
                keys.jump = false; // consume trigger
                createDoubleJumpEffect(this.x + this.w / 2, this.y + this.h);
                addFloatingText(this.x + this.w / 2 - 20, this.y - 12, 'HIGH DOUBLE JUMP!', '#55ffff');
              }
            }

            // Variable jump height: holding jump button lets you reach maximum high jump altitude
            if (!keys.jumpHeld && this.vy < -200) {
              this.vy *= 0.58;
            }

            // Gravity
            this.vy += GRAVITY * dt;
            if (this.vy > 650) this.vy = 650;

            // Move X and resolve collisions
            this.x += this.vx * dt;
            // Prevent going behind camera left
            if (this.x < cameraX) {
              this.x = cameraX;
              this.vx = 0;
            }
            this.resolveCollisionsX();

            // Move Y and resolve collisions
            this.y += this.vy * dt;
            this.isGrounded = false;
            this.resolveCollisionsY();

            // Hazard and trigger checks (Lava & Axe)
            for (const b of blocks) {
              if (b.type === BlockType.LAVA && checkAABB(this, b)) {
                this.die();
                createBrickDebris(this.x + this.w / 2, this.y + this.h);
                return;
              }
              if (b.type === BlockType.AXE && checkAABB(this, b)) {
                triggerAxeSwitch();
              }
            }

            // Check pit fall death
            if (this.y > VIEW_HEIGHT + 60) {
              this.die();
            }

            // Walking animation cycle
            if (Math.abs(this.vx) > 10 && this.isGrounded) {
              this.animTimer += dt * (Math.abs(this.vx) / 20);
              this.walkFrame = Math.floor(this.animTimer) % 3;
            } else {
              this.walkFrame = 0;
            }
          }

          resolveCollisionsX() {
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vx > 0) {
                  this.x = b.x - this.w;
                  this.vx = 0;
                } else if (this.vx < 0) {
                  this.x = b.x + b.w;
                  this.vx = 0;
                }
              }
            }
          }

          resolveCollisionsY() {
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vy > 0) {
                  // Falling onto block
                  this.y = b.y - this.h;
                  this.vy = 0;
                  this.isGrounded = true;
                  this.jumpCount = 0;
                  this.isSpinning = false;
                  this.spinAngle = 0;
                } else if (this.vy < 0) {
                  // Bumping head on bottom of block
                  this.y = b.y + b.h;
                  this.vy = 0;
                  b.hit(this);
                }
              }
            }
          }
        }

        // --- BLOCK CLASSES ---
        const BlockType = {
          GROUND: 'GROUND',
          BRICK: 'BRICK',
          QUESTION: 'QUESTION',
          HIT: 'HIT',
          PIPE: 'PIPE',
          STONE: 'STONE',
          LAVA: 'LAVA',
          BRIDGE: 'BRIDGE',
          AXE: 'AXE'
        };

        class Block {
          constructor(x, y, w, h, type, content = 'coin') {
            this.x = x;
            this.y = y;
            this.w = w;
            this.h = h;
            this.type = type;
            this.content = content; // 'coin', 'mushroom', 'none'
            this.solid = !(type === BlockType.LAVA || type === BlockType.AXE);
            this.bumpOffset = 0;
            this.bumpSpeed = 0;
            this.isBumping = false;
          }

          hit(playerRef) {
            if (this.type === BlockType.QUESTION) {
              this.triggerBump();
              Sound.bump();
              this.type = BlockType.HIT;

              if (this.content === 'mushroom') {
                Sound.powerupAppear();
                items.push(new SuperMushroom(this.x + 4, this.y - 28));
              } else {
                // Coin
                Sound.coin();
                score += 100;
                coins++;
                particles.push(new BounceCoin(this.x + 8, this.y - 20));
                addFloatingText(this.x + 6, this.y - 24, '100', '#ffff44');
              }
            } else if (this.type === BlockType.BRICK) {
              if (playerRef.isSuper) {
                // Super Mario smashes bricks!
                Sound.breakBrick();
                score += 50;
                this.solid = false;
                createBrickDebris(this.x, this.y);
                const idx = blocks.indexOf(this);
                if (idx !== -1) blocks.splice(idx, 1);
              } else {
                // Small Mario bumps bricks
                Sound.bump();
                this.triggerBump();
              }
            }
          }

          triggerBump() {
            this.isBumping = true;
            this.bumpOffset = -8;
            this.bumpSpeed = 40;
          }

          update(dt) {
            if (this.isBumping) {
              this.bumpOffset += this.bumpSpeed * dt;
              if (this.bumpOffset >= 0) {
                this.bumpOffset = 0;
                this.isBumping = false;
              }
            }
          }
        }

        // --- ENEMY CLASS (GOOMBA) ---
        class Goomba {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.w = 28;
            this.h = 28;
            this.vx = -55;
            this.vy = 0;
            this.isGrounded = false;
            this.alive = true;
            this.squashedTimer = 0;
            this.animTimer = 0;
            this.active = false;
          }

          update(dt) {
            // Activate when close to camera
            if (!this.active) {
              if (this.x < cameraX + VIEW_WIDTH + 60) {
                this.active = true;
              }
              return;
            }

            if (!this.alive) {
              this.squashedTimer -= dt;
              return;
            }

            this.animTimer += dt * 6;
            this.vy += GRAVITY * dt;
            if (this.vy > 600) this.vy = 600;

            // X Movement
            this.x += this.vx * dt;
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vx > 0) {
                  this.x = b.x - this.w;
                  this.vx = -this.vx;
                } else if (this.vx < 0) {
                  this.x = b.x + b.w;
                  this.vx = -this.vx;
                }
              }
            }

            // Y Movement
            this.y += this.vy * dt;
            this.isGrounded = false;
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vy > 0) {
                  this.y = b.y - this.h;
                  this.vy = 0;
                  this.isGrounded = true;
                }
              }
            }

            // Off screen or fallen into pit
            if (this.y > VIEW_HEIGHT + 100) {
              this.alive = false;
              this.squashedTimer = 0;
            }
          }

          stomp() {
            this.alive = false;
            this.squashedTimer = 0.5;
            this.h = 12;
            this.y += 16;
            Sound.stomp();
            score += 200;
            addFloatingText(this.x + 4, this.y, '200', '#ffffff');
          }
        }

        // --- ENEMY CLASS (KOOPA TROOPA) ---
        class Koopa {
          constructor(x, y, isBlue = false) {
            this.x = x;
            this.y = y;
            this.w = 28;
            this.h = 36;
            this.vx = -45;
            this.vy = 0;
            this.alive = true;
            this.inShell = false;
            this.sliding = false;
            this.active = false;
            this.animTimer = 0;
            this.isBlue = isBlue;
            this.facing = -1;
          }

          update(dt) {
            if (!this.active) {
              if (this.x < cameraX + VIEW_WIDTH + 60) this.active = true;
              return;
            }
            if (!this.alive) return;

            this.animTimer += dt * 6;
            this.vy += GRAVITY * dt;
            if (this.vy > 600) this.vy = 600;

            // X Movement
            this.x += this.vx * dt;
            if (this.vx > 0) this.facing = 1;
            else if (this.vx < 0) this.facing = -1;

            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vx > 0) {
                  this.x = b.x - this.w;
                  this.vx = -this.vx;
                  if (this.sliding) Sound.bump();
                } else if (this.vx < 0) {
                  this.x = b.x + b.w;
                  this.vx = -this.vx;
                  if (this.sliding) Sound.bump();
                }
              }
            }

            // Y Movement
            this.y += this.vy * dt;
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vy > 0) {
                  this.y = b.y - this.h;
                  this.vy = 0;
                }
              }
            }

            // Shell hitting other enemies when sliding!
            if (this.sliding) {
              enemies.forEach(other => {
                if (other !== this && other.alive && checkAABB(this, other)) {
                  other.alive = false;
                  if (other.stomp) other.stomp();
                  Sound.stomp();
                  score += 400;
                  addFloatingText(other.x, other.y, '400', '#ffd700');
                }
              });
            }

            if (this.y > VIEW_HEIGHT + 100) this.alive = false;
          }

          stomp(playerFacing = 1) {
            if (!this.inShell) {
              // Hide in shell
              this.inShell = true;
              this.vx = 0;
              this.h = 24;
              this.y += 12;
              Sound.stomp();
              score += 200;
              addFloatingText(this.x + 4, this.y, '200', '#ffffff');
            } else if (!this.sliding) {
              // Kick sliding shell!
              this.sliding = true;
              this.vx = (playerFacing >= 0 ? 1 : -1) * 320;
              Sound.stomp();
              score += 400;
              addFloatingText(this.x + 4, this.y, 'SHELL KICK!', '#ffff00');
            } else {
              // Stop sliding shell
              this.sliding = false;
              this.vx = 0;
              Sound.stomp();
            }
          }
        }

        // --- BOSS CLASS (BOWSER / CASTLE BOSS) ---
        class BowserBoss {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.w = 56;
            this.h = 56;
            this.vx = -30;
            this.vy = 0;
            this.startX = x;
            this.alive = true;
            this.active = false;
            this.defeated = false;
            this.fireTimer = 2.0;
            this.jumpTimer = 2.8;
            this.facing = -1;
            this.animTimer = 0;
            this.health = 5;
          }

          update(dt) {
            if (!this.active) {
              if (this.x < cameraX + VIEW_WIDTH + 80) {
                this.active = true;
                Sound.bossRoar();
              }
              return;
            }

            if (this.defeated) {
              this.vy += GRAVITY * dt;
              this.y += this.vy * dt;
              return;
            }

            this.animTimer += dt * 6;

            // Paces back and forth along the bridge
            this.x += this.vx * dt;
            if (this.x < this.startX - 150) {
              this.x = this.startX - 150;
              this.vx = 35;
            } else if (this.x > this.startX + 60) {
              this.x = this.startX + 60;
              this.vx = -35;
            }

            // Bowser jump
            this.jumpTimer -= dt;
            if (this.jumpTimer <= 0) {
              this.jumpTimer = 2.6 + Math.random() * 1.5;
              this.vy = -340;
            }

            this.vy += GRAVITY * dt;
            if (this.vy > 550) this.vy = 550;
            this.y += this.vy * dt;

            // Keep on bridge
            if (this.y > GROUND_Y - this.h) {
              this.y = GROUND_Y - this.h;
              this.vy = 0;
            }

            // Breathe fireballs towards player
            this.fireTimer -= dt;
            if (this.fireTimer <= 0) {
              this.fireTimer = 2.4 + Math.random() * 1.4;
              Sound.bossRoar();
              bossFireballs.push(new BossFireball(this.x - 14, this.y + 14, -145));
              addFloatingText(this.x, this.y - 12, '🔥 FIRE!', '#ff3300');
            }
          }

          defeat() {
            if (this.defeated) return;
            this.defeated = true;
            this.vy = -220;
            Sound.die();
            score += 5000;
            addFloatingText(this.x, this.y - 30, '⭐ 5000 BOWSER DEFEATED! ⭐', '#ffd700');
          }
        }

        // --- ITEMS & PARTICLES ---
        class SuperMushroom {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.w = 24;
            this.h = 24;
            this.vx = 75;
            this.vy = -60;
            this.alive = true;
            this.emergeTimer = 0.3;
          }

          update(dt) {
            if (this.emergeTimer > 0) {
              this.emergeTimer -= dt;
              this.y -= 30 * dt;
              return;
            }

            this.vy += GRAVITY * dt;
            if (this.vy > 550) this.vy = 550;

            this.x += this.vx * dt;
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vx > 0) {
                  this.x = b.x - this.w;
                  this.vx = -this.vx;
                } else if (this.vx < 0) {
                  this.x = b.x + b.w;
                  this.vx = -this.vx;
                }
              }
            }

            this.y += this.vy * dt;
            for (const b of blocks) {
              if (!b.solid) continue;
              if (checkAABB(this, b)) {
                if (this.vy > 0) {
                  this.y = b.y - this.h;
                  this.vy = 0;
                }
              }
            }

            if (this.y > VIEW_HEIGHT + 60) this.alive = false;
          }
        }

        class FloatingCoin {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.w = 20;
            this.h = 24;
            this.animTimer = Math.random() * 10;
            this.collected = false;
          }

          update(dt) {
            this.animTimer += dt * 7;
          }
        }

        class BounceCoin {
          constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vy = -340;
            this.alpha = 1.0;
            this.animTimer = 0;
          }

          update(dt) {
            this.y += this.vy * dt;
            this.vy += 900 * dt;
            this.animTimer += dt * 14;
            this.alpha -= 1.2 * dt;
          }
        }

        class BrickParticle {
          constructor(x, y, vx, vy) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.rotation = 0;
            this.life = 1.2;
          }

          update(dt) {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.vy += 1200 * dt;
            this.rotation += 8 * dt;
            this.life -= dt;
          }
        }

        function createBrickDebris(x, y) {
          particles.push(new BrickParticle(x + 4, y + 4, -140, -380));
          particles.push(new BrickParticle(x + 18, y + 4, 140, -380));
          particles.push(new BrickParticle(x + 4, y + 18, -100, -260));
          particles.push(new BrickParticle(x + 18, y + 18, 100, -260));
        }

        function createDust(x, y) {
          for (let i = 0; i < 4; i++) {
            particles.push({
              x: x + (Math.random() - 0.5) * 16,
              y: y - 2,
              vx: (Math.random() - 0.5) * 60,
              vy: -Math.random() * 40,
              r: 3 + Math.random() * 3,
              alpha: 0.8,
              update: function(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= 2.5 * dt;
              }
            });
          }
        }

        function createDoubleJumpEffect(x, y) {
          for (let i = 0; i < 10; i++) {
            const angle = (Math.PI * 2 / 10) * i;
            const spd = 65 + Math.random() * 55;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd * 0.6 + 15,
              r: 3.5,
              alpha: 1.0,
              color: '#00ffff',
              update: function(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= 2.6 * dt;
              }
            });
          }
        }

        function addFloatingText(x, y, text, color = '#fff') {
          floatingTexts.push({
            x: x,
            y: y,
            text: text,
            color: color,
            alpha: 1.0,
            vy: -45,
            update: function(dt) {
              this.y += this.vy * dt;
              this.alpha -= 1.1 * dt;
            }
          });
        }

        class SkyBird {
          constructor(x, y, speed = 48, size = 1.0, color = '#1c2844') {
            this.x = x;
            this.baseY = y;
            this.y = y;
            this.speed = speed;
            this.size = size;
            this.color = color;
            this.wingTimer = Math.random() * 10;
            this.flapSpeed = 8 + Math.random() * 4;
            this.waveOffset = Math.random() * Math.PI * 2;
          }

          update(dt) {
            this.x += this.speed * dt;
            this.wingTimer += dt * this.flapSpeed;
            this.y = this.baseY + Math.sin(this.wingTimer * 0.35 + this.waveOffset) * 6;

            if (this.speed > 0 && this.x > LEVEL_WIDTH + 300) {
              this.x = -200;
            } else if (this.speed < 0 && this.x < -300) {
              this.x = LEVEL_WIDTH + 200;
            }
          }
        }

        class SkyAeroplane {
          constructor(x, y, speed = 65) {
            this.x = x;
            this.baseY = y;
            this.y = y;
            this.speed = speed;
            this.propTimer = 0;
            this.smokeTimer = 0;
            this.bannerWave = 0;
          }

          update(dt) {
            this.x += this.speed * dt;
            this.propTimer += dt * 32;
            this.bannerWave += dt * 4.5;
            this.y = this.baseY + Math.sin(this.bannerWave * 0.4) * 4;

            this.smokeTimer += dt;
            if (this.smokeTimer > 0.16) {
              this.smokeTimer = 0;
              particles.push({
                x: this.x - 36,
                y: this.y + 4 + (Math.random() - 0.5) * 4,
                vx: -22 - Math.random() * 12,
                vy: (Math.random() - 0.5) * 6,
                r: 3 + Math.random() * 2,
                alpha: 0.7,
                color: '#ffffff',
                update: function(pdt) {
                  this.x += this.vx * pdt;
                  this.y += this.vy * pdt;
                  this.r += pdt * 3.5;
                  this.alpha -= pdt * 0.85;
                }
              });

            if (this.x > LEVEL_WIDTH + 600) {
              this.x = -350;
            }
          }
        }

        // --- AABB COLLISION HELPER ---
        function checkAABB(r1, r2) {
          return (
            r1.x < r2.x + r2.w &&
            r1.x + r1.w > r2.x &&
            r1.y < r2.y + r2.h &&
            r1.y + r1.h > r2.y
          );
        }

        // Helper to add ground segment
        function addGround(startX, endX) {
          const width = endX - startX;
          // Top ground block
          blocks.push(new Block(startX, GROUND_Y, width, 32, BlockType.GROUND));
          // Underground fill
          blocks.push(new Block(startX, GROUND_Y + 32, width, 32, BlockType.STONE));
        }

          blocks.push(new Block(x, y, 64, height, BlockType.PIPE));

        // Staircase helper
        function addStairs(startX, steps, dir = 1) {
          for (let step = 1; step <= steps; step++) {
            const currentX = dir === 1 ? startX + (step - 1) * 32 : startX + (steps - step) * 32;
            const h = step * 32;
            blocks.push(new Block(currentX, GROUND_Y - h, 32, h, BlockType.STONE));
          }
        }

        // Main Level Dispatcher
        function buildLevel(stageNum = currentStage) {
          blocks = [];
          enemies = [];
          items = [];
          coinsList = [];
          particles = [];
          floatingTexts = [];
          bossFireballs = [];
          skyBirds = [];
          skyPlanes = [];
          bowser = null;
          axeBlock = null;

          if (stageNum === 2) {
            buildStage2();
          } else if (stageNum === 3) {
            buildStage3();
          } else {
            buildStage1();
          }
        }

        function startStage(stageNum) {
          currentStage = Math.max(1, Math.min(TOTAL_STAGES, stageNum));
          const stageSelect = document.getElementById('stage-select');
          if (stageSelect) stageSelect.value = currentStage.toString();
          levelTime = 400;
          timeTimer = 0;
          cameraX = 0;
          victoryTimer = 0;
          victoryBonusCalculated = false;
          buildLevel(currentStage);
          if (!player) {
            player = new Player(80, GROUND_Y - 40);
          } else {
            player.reset(80, GROUND_Y - 40);
          }
          currentState = GameState.STAGE_CARD;
          stageCardTimer = 1.3;
          bgmNoteIndex = 0;
          bgmTimer = 0;
        }

        function startGame() {
          startStage(currentStage);
        }

        function resetGame(fullReset = false) {
          if (fullReset) {
            score = 0;
            coins = 0;
            lives = 3;
            currentStage = 1;
            const stageSelect = document.getElementById('stage-select');
            if (stageSelect) stageSelect.value = '1';
          }
          levelTime = 400;
          timeTimer = 0;
          cameraX = 0;
          victoryTimer = 0;
          victoryBonusCalculated = false;
          buildLevel(currentStage);
          if (!player) {
            player = new Player(80, GROUND_Y - 40);
          } else {
            player.reset(80, GROUND_Y - 40);
          }
          currentState = GameState.START;
        }

        // Initialize world
        resetGame(true);

        // --- DRAWING ROUTINES (PIXEL ART WITH CANVAS) ---

        function drawBackground(camX) {
          if (currentStage === 2) {
            // --- STAGE 2: UNDERGROUND CAVERN ---
            ctx.fillStyle = '#050814';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // Cavern ceiling stalactites and rock pillars (anchored to world coords: wx - camX)
            for (let wx = 0; wx < LEVEL_WIDTH + 200; wx += 180) {
              const x = wx - camX;
              if (x > -100 && x < VIEW_WIDTH + 100) {
                ctx.fillStyle = '#0c152b';
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x + 25, 90);
                ctx.lineTo(x + 50, 0);
                ctx.fill();

                // Distant stone pillar
                ctx.fillRect(x + 80, 0, 36, VIEW_HEIGHT);

                // Foreground pillar with cyan trim
                ctx.fillStyle = '#142244';
                ctx.fillRect(x + 130, 0, 48, VIEW_HEIGHT);
                ctx.fillStyle = '#008088';
                ctx.fillRect(x + 134, 0, 4, VIEW_HEIGHT);
              }
            }
          } else if (currentStage === 3) {
            // --- STAGE 3: BOWSER'S LAVA CASTLE ---
            ctx.fillStyle = '#120507';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // Bottom Lava Glow Gradient
            const glow = ctx.createLinearGradient(0, VIEW_HEIGHT - 180, 0, VIEW_HEIGHT);
            glow.addColorStop(0, 'rgba(255, 60, 0, 0.0)');
            glow.addColorStop(1, 'rgba(255, 40, 0, 0.4)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, VIEW_HEIGHT - 180, VIEW_WIDTH, 180);

            // Fortress brick battlements & columns (anchored to world coords: wx - camX)
            for (let wx = 0; wx < LEVEL_WIDTH + 200; wx += 220) {
              const x = wx - camX;
              if (x > -100 && x < VIEW_WIDTH + 100) {
                ctx.fillStyle = '#220d12';
                ctx.fillRect(x, 0, 52, VIEW_HEIGHT);

                // Castle arch window
                ctx.fillStyle = '#090203';
                ctx.beginPath();
                ctx.arc(x + 26, 120, 14, Math.PI, 0);
                ctx.rect(x + 12, 120, 28, 40);
                ctx.fill();

                // Torch flame in window
                const flicker = Math.sin(Date.now() / 80 + wx) * 2;
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.arc(x + 26, 135 + flicker, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffff55';
                ctx.beginPath();
                ctx.arc(x + 26, 135 + flicker, 3, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          } else {
            // --- STAGE 1: VIBRANT OVERWORLD SKY ---
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // 1. Distant Brown Mountains (Anchored to world coordinates: wx - camX)
            // As Mario runs forward, the mountains stay fixed in place and scroll backward.
            const mountainWorldXs = [0, 680, 1360, 2040, 2720];
            for (const wx of mountainWorldXs) {
              const x = wx - camX;
              if (x > -260 && x < VIEW_WIDTH + 60) {
                drawMountain(x, GROUND_Y);
              }
            }

            // 2. Fluffy Clouds (Anchored to world coordinates: wx - camX)
            // Fixed positions across the sky so Mario runs past them.
            const cloudPositions = [
              { x: 120, y: 70, s: 1.0 },
              { x: 380, y: 120, s: 0.8 },
              { x: 620, y: 60, s: 1.1 },
              { x: 920, y: 110, s: 0.85 },
              { x: 1240, y: 75, s: 1.0 },
              { x: 1540, y: 130, s: 0.8 },
              { x: 1820, y: 65, s: 1.05 },
              { x: 2180, y: 115, s: 0.9 },
              { x: 2520, y: 70, s: 1.0 },
              { x: 2840, y: 125, s: 0.8 },
              { x: 3120, y: 80, s: 1.0 },
            ];
            for (const cp of cloudPositions) {
              const x = cp.x - camX;
              if (x > -180 && x < VIEW_WIDTH + 80) {
                drawCloud(x, cp.y, cp.s);
              }
            }

            // 3. Rolling Green Hills & Bushes (Anchored to world coordinates: wx - camX)
            const hillWorldXs = [240, 880, 1520, 2160, 2800];
            for (const wx of hillWorldXs) {
              const x = wx - camX;
              if (x > -120 && x < VIEW_WIDTH + 80) {
                drawHill(x, GROUND_Y, 88, 54);
              }
            }

            const bushWorldXs = [420, 1060, 1700, 2340, 2980];
            for (const wx of bushWorldXs) {
              const x = wx - camX;
              if (x > -100 && x < VIEW_WIDTH + 80) {
                drawBush(x, GROUND_Y, 60, 26);
              }
            }
          }
        }

        function drawMountain(x, groundY) {
          ctx.fillStyle = '#7c4a24';
          ctx.beginPath();
          ctx.moveTo(x, groundY);
          ctx.lineTo(x + 120, groundY - 110);
          ctx.lineTo(x + 240, groundY);
          ctx.fill();

          // Mountain highlight / sunlit ridge
          ctx.fillStyle = '#a66938';
          ctx.beginPath();
          ctx.moveTo(x + 60, groundY);
          ctx.lineTo(x + 120, groundY - 110);
          ctx.lineTo(x + 140, groundY - 70);
          ctx.lineTo(x + 100, groundY);
          ctx.fill();

          // Subtle ridge edge shadow
          ctx.strokeStyle = '#593215';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 120, groundY - 110);
          ctx.lineTo(x + 100, groundY);
          ctx.stroke();
        }

        function drawCloud(x, y, scale = 1.0) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#ffffff';

          ctx.beginPath();
          ctx.arc(40, 25, 20, 0, Math.PI * 2);
          ctx.arc(65, 18, 25, 0, Math.PI * 2);
          ctx.arc(95, 22, 22, 0, Math.PI * 2);
          ctx.arc(120, 28, 16, 0, Math.PI * 2);
          ctx.rect(35, 25, 95, 18);
          ctx.fill();

          // Soft blue shadow on bottom edge
          ctx.fillStyle = '#d4e4ff';
          ctx.fillRect(35, 38, 95, 5);
          ctx.restore();
        }

        function drawHill(x, y, w, h) {
          ctx.fillStyle = '#00a800';
          ctx.beginPath();
          ctx.arc(x + w / 2, y, w / 2, Math.PI, 0);
          ctx.fill();

          // Highlight rim
          ctx.strokeStyle = '#004000';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Dots pattern
          ctx.fillStyle = '#006000';
          ctx.fillRect(x + w / 2 - 8, y - h * 0.6, 4, 4);
          ctx.fillRect(x + w / 2 + 6, y - h * 0.4, 4, 4);
        }

        function drawBush(x, y, w, h) {
          ctx.fillStyle = '#80d010';
          ctx.beginPath();
          ctx.arc(x + 14, y, 14, Math.PI, 0);
          ctx.arc(x + w / 2, y, 18, Math.PI, 0);
          ctx.arc(x + w - 14, y, 14, Math.PI, 0);
          ctx.fill();

          ctx.strokeStyle = '#008000';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        function drawSkyBird(b, camX) {
          const sx = b.x - camX;
          if (sx < -60 || sx > VIEW_WIDTH + 60) return;

          ctx.save();
          ctx.translate(sx, b.y);
          const dir = b.speed >= 0 ? 1 : -1;
          ctx.scale(dir * b.size, b.size);

          // Wing flap cycle: -1 to 1
          const wingPhase = Math.sin(b.wingTimer);

          ctx.fillStyle = b.color;
          // Body
          ctx.beginPath();
          ctx.ellipse(0, 0, 7, 3.5, 0, 0, Math.PI * 2);
          ctx.fill();

          // Head & Beak
          ctx.beginPath();
          ctx.arc(6, -2, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffaa00'; // Yellow/orange beak
          ctx.beginPath();
          ctx.moveTo(8, -3);
          ctx.lineTo(12, -1.5);
          ctx.lineTo(8, 0);
          ctx.fill();

          // Eye
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(5, -3, 2, 2);
          ctx.fillStyle = '#000000';
          ctx.fillRect(6, -3, 1, 1);

          // Wings (animated flap up/down)
          ctx.fillStyle = b.color;
          const wingY = wingPhase * 7;
          ctx.beginPath();
          ctx.moveTo(-4, -1);
          ctx.lineTo(-2, -9 + wingY);
          ctx.lineTo(4, -1);
          ctx.fill();

          // Tail feathers
          ctx.beginPath();
          ctx.moveTo(-6, -1);
          ctx.lineTo(-11, -3);
          ctx.lineTo(-9, 0);
          ctx.lineTo(-11, 2);
          ctx.lineTo(-6, 1);
          ctx.fill();

          ctx.restore();
        }

        function drawAeroplane(plane, camX) {
          const sx = plane.x - camX;
          if (sx < -320 || sx > VIEW_WIDTH + 100) return;

          ctx.save();
          ctx.translate(sx, plane.y);

          // 1. Tow Cable and Trailing Banner
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-32, 2);
          ctx.lineTo(-58, 2);
          ctx.stroke();

          // Waving Banner
          const bannerX = -58;
          const bannerW = 126;
          const bannerH = 22;
          const wave = Math.sin(plane.bannerWave) * 3.5;

          ctx.save();
          ctx.translate(bannerX - bannerW, wave);

          // Banner background cloth
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#e52521';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.rect(0, -11, bannerW, bannerH);
          ctx.fill();
          ctx.stroke();

          // Banner grommet holes
          ctx.fillStyle = '#999999';
          ctx.fillRect(bannerW - 6, -3, 3, 3);

          // Banner text
          ctx.fillStyle = '#e52521';
          ctx.font = 'bold 11px "Courier New", Courier, monospace';
          ctx.textAlign = 'center';
          ctx.fillText('★ SUPER RETRO ★', bannerW / 2, 4);

          ctx.restore();

          // 2. Retro Red & White Propeller Biplane
          // Main Fuselage
          ctx.fillStyle = '#d62420'; // Aviation Red
          ctx.beginPath();
          ctx.moveTo(18, -4);
          ctx.lineTo(24, 0);
          ctx.lineTo(18, 6);
          ctx.lineTo(-28, 4);
          ctx.lineTo(-32, 0);
          ctx.lineTo(-28, -4);
          ctx.closePath();
          ctx.fill();

          // White racing fuselage stripe
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-22, -1, 38, 3);

          // Yellow cockpit canopy
          ctx.fillStyle = '#ffe040';
          ctx.beginPath();
          ctx.arc(6, -5, 5, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#222222';
          ctx.fillRect(5, -4, 2, 2); // Pilot goggles

          // Top Wing
          ctx.fillStyle = '#f5f5f5';
          ctx.fillRect(-12, -14, 30, 4);
          ctx.fillStyle = '#d62420';
          ctx.fillRect(-10, -14, 26, 2);

          // Wing struts
          ctx.strokeStyle = '#666666';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(2, -10); ctx.lineTo(2, -4);
          ctx.moveTo(12, -10); ctx.lineTo(12, -4);
          ctx.stroke();

          // Bottom Wing
          ctx.fillStyle = '#f5f5f5';
          ctx.fillRect(-8, 5, 26, 4);
          ctx.fillStyle = '#d62420';
          ctx.fillRect(-6, 7, 22, 2);

          // Tail Fin & Rudder
          ctx.fillStyle = '#f5f5f5';
          ctx.beginPath();
          ctx.moveTo(-24, -4);
          ctx.lineTo(-34, -14);
          ctx.lineTo(-28, -14);
          ctx.lineTo(-20, -4);
          ctx.fill();

          // Landing Gear Wheels
          ctx.fillStyle = '#333333';
          ctx.beginPath();
          ctx.arc(-2, 11, 3, 0, Math.PI * 2);
          ctx.arc(10, 11, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#666666';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-2, 7); ctx.lineTo(-2, 11);
          ctx.moveTo(10, 7); ctx.lineTo(10, 11);
          ctx.stroke();

          // Spinning Propeller Nose
          ctx.fillStyle = '#ffff00';
          ctx.beginPath();
          ctx.arc(24, 1, 3, 0, Math.PI * 2);
          ctx.fill();

          // Propeller Blade spin animation
          const propBlur = Math.sin(plane.propTimer);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.fillRect(25, 1 - 10 * propBlur, 2, 20 * propBlur);

          ctx.restore();
        }

        function drawBlock(b, camX) {
          const screenX = Math.round(b.x - camX);
          const screenY = Math.round(b.y + b.bumpOffset);

          if (screenX + b.w < -20 || screenX > VIEW_WIDTH + 20) return;

          ctx.save();
          ctx.translate(screenX, screenY);

          if (b.type === BlockType.LAVA) {
            // Animated Boiling Magma Liquid
            ctx.fillStyle = '#e52521';
            ctx.fillRect(0, 0, b.w, b.h);

            // Glowing bubbling magma wave on top surface
            const wave = Math.sin((Date.now() / 150) + (b.x / 40)) * 3;
            ctx.fillStyle = '#ff9900';
            ctx.fillRect(0, 0, b.w, 6 + wave);

            ctx.fillStyle = '#ffff33';
            for (let lx = 0; lx < b.w; lx += 16) {
              const spark = Math.sin((Date.now() / 100) + lx) * 3;
              ctx.fillRect(lx, 2 + spark, 8, 3);
            }
          } else if (b.type === BlockType.BRIDGE) {
            // Wooden Rope/Chain Bridge Planks
            ctx.fillStyle = '#945220';
            ctx.fillRect(0, 0, b.w, b.h);

            // Wood plank dividers
            ctx.fillStyle = '#4a2508';
            for (let px = 0; px < b.w; px += 16) {
              ctx.fillRect(px, 0, 2, b.h);
            }
            // Iron rim support
            ctx.fillStyle = '#222222';
            ctx.fillRect(0, b.h - 4, b.w, 4);
            // Iron rivets
            ctx.fillStyle = '#aaaaaa';
            for (let px = 6; px < b.w; px += 16) {
              ctx.fillRect(px, 4, 3, 3);

            ctx.lineTo(26, 20);
            ctx.lineTo(16, 14);
            ctx.lineTo(6, 20);
            ctx.lineTo(4, 2);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(22, 4, 3, 3);

          } else if (b.type === BlockType.GROUND) {
            if (currentStage === 2) {
              // Underground Cyan/Navy Stone Ground
              ctx.fillStyle = '#008088';
              ctx.fillRect(0, 0, b.w, b.h);
              ctx.fillStyle = '#004048';
              for (let bx = 0; bx < b.w; bx += 32) {
                ctx.fillRect(bx, 0, 2, b.h);

              ctx.fillStyle = '#c84c0c';

            ctx.fillStyle = '#000000';

            ctx.fillRect(0, 0, b.w, b.h);

            for (let bx = 0; bx < b.w; bx += 32) {

          } else if (b.type === BlockType.BRICK) {

            const mortarColor = currentStage === 2 ? '#002028' : currentStage === 3 ? '#281818' : '#401000';
            const topColor = currentStage === 2 ? '#00e8d8' : currentStage === 3 ? '#888890' : '#fce4a0';

            ctx.fillStyle = topColor;
            ctx.fillRect(1, 1, b.w - 2, 2);

          } else if (b.type === BlockType.HIT) {

            if (!p.isGrounded) {
              // High athletic jump pose: forward knee tucked, back leg extended
              ctx.fillRect(-11, 8, 8, 10);
              ctx.fillRect(4, 3, 8, 11);

              ctx.fillStyle = shoeSole;

              ctx.fillRect(-12, 21, 11, 2);
              ctx.fillRect(3, 21, 11, 2);

              // Walk animation frames
              const frame = p.walkFrame;
              if (frame === 0) {
                ctx.fillRect(-8, 8, 7, 10);
                ctx.fillRect(2, 8, 7, 10);
                ctx.fillStyle = shoeColor;
                ctx.fillRect(-10, 17, 9, 6);
                ctx.fillRect(2, 17, 9, 6);

                ctx.fillRect(3, 8, 7, 10);
                ctx.fillStyle = shoeColor;
                ctx.fillRect(-13, 15, 10, 6);
                ctx.fillRect(3, 17, 9, 6);
                ctx.fillStyle = shoeSole;
                ctx.fillRect(-13, 20, 11, 2);
                ctx.fillRect(3, 22, 10, 2);
              } else {
                ctx.fillRect(-7, 8, 7, 10);
                ctx.fillRect(4, 7, 8, 9);
                ctx.fillStyle = shoeColor;
                ctx.fillRect(-9, 17, 9, 6);
                ctx.fillRect(4, 15, 10, 6);
                ctx.fillStyle = shoeSole;
                ctx.fillRect(-9, 22, 10, 2);
                ctx.fillRect(4, 20, 11, 2);
              }
            }
          } else {
            // ============================================
            // --- REGULAR HERO (SMALL, CRISP HUMAN SPRITE) ---

                ctx.fillRect(-8, 12, 8, 2);
