        function drawGoomba(g, camX) {
          const screenX = Math.round(g.x - camX);
          const screenY = Math.round(g.y);

          if (screenX + g.w < -20 || screenX > VIEW_WIDTH + 20) return;

          ctx.save();
          ctx.translate(screenX, screenY);

          if (!g.alive) {
            // High-detail squashed Goomba
            ctx.fillStyle = '#6b300a';
            ctx.beginPath();
            ctx.ellipse(g.w / 2, g.h - 3, g.w / 2, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#a85010';
            ctx.beginPath();
            ctx.ellipse(g.w / 2, g.h - 4, g.w / 2 - 2, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Crossed dizzy X eyes
            ctx.fillStyle = '#000000';
            ctx.fillRect(5, g.h - 7, 4, 2);
            ctx.fillRect(15, g.h - 7, 4, 2);
            ctx.fillRect(6, g.h - 8, 2, 4);
            ctx.fillRect(16, g.h - 8, 2, 4);
            ctx.restore();
            return;
          }

          // 1. Mushroom Cap Shadow & Outer Silhouette
          ctx.fillStyle = '#642908';
          ctx.beginPath();
          ctx.ellipse(g.w / 2, 12, g.w / 2, 12, 0, 0, Math.PI * 2);
          ctx.fill();

          // 2. Cap Base Color
          ctx.fillStyle = '#b85418';
          ctx.beginPath();
          ctx.ellipse(g.w / 2, 11, g.w / 2 - 1, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          // 3. Cap Top Specular Highlight
          ctx.fillStyle = '#e88438';
          ctx.beginPath();
          ctx.ellipse(g.w / 2 - 2, 7, g.w / 3, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // 4. Stem / Stalk Body with warm gradient shading
          ctx.fillStyle = '#cca870';
          ctx.fillRect(g.w / 2 - 7, 13, 14, 9);
          ctx.fillStyle = '#fce4a0';
          ctx.fillRect(g.w / 2 - 6, 13, 12, 7);

          // 5. Angry Brows & Eyes
          ctx.fillStyle = '#000000';
          // Sharp downward angled brows
          ctx.beginPath();
          ctx.moveTo(3, 5); ctx.lineTo(10, 8); ctx.lineTo(10, 10); ctx.lineTo(3, 7); ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(21, 5); ctx.lineTo(14, 8); ctx.lineTo(14, 10); ctx.lineTo(21, 7); ctx.closePath(); ctx.fill();

          // Sclera
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(5, 7, 5, 8);
          ctx.fillRect(15, 7, 5, 8);

          // Dark vertical pupils with glints
          ctx.fillStyle = '#000000';
          ctx.fillRect(7, 8, 3, 6);
          ctx.fillRect(15, 8, 3, 6);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(7, 9, 1, 2);
          ctx.fillRect(15, 9, 1, 2);

          // Fangs on lower jaw
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(7, 21); ctx.lineTo(9, 17); ctx.lineTo(11, 21); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(13, 21); ctx.lineTo(15, 17); ctx.lineTo(17, 21); ctx.fill();

          // 6. Walking Wobbly Feet with leather shine
          const step = Math.sin(g.animTimer) > 0;
          ctx.fillStyle = '#220d00'; // Sole
          ctx.fillRect(step ? 1 : 2, 26, 10, 2);
          ctx.fillRect(step ? 17 : 16, 26, 9, 2);

          ctx.fillStyle = '#4a2006';
          if (step) {
            ctx.fillRect(1, 21, 10, 6);
            ctx.fillRect(17, 22, 9, 5);
            ctx.fillStyle = '#7a3e14';
            ctx.fillRect(2, 21, 4, 2);
          } else {
            ctx.fillRect(2, 22, 9, 5);
            ctx.fillRect(16, 21, 10, 6);
            ctx.fillStyle = '#7a3e14';
            ctx.fillRect(17, 21, 4, 2);
          }

          ctx.restore();
        }

        function drawKoopa(k, camX) {
          const screenX = Math.round(k.x - camX);
          const screenY = Math.round(k.y);

          if (screenX + k.w < -20 || screenX > VIEW_WIDTH + 20) return;

          ctx.save();
          ctx.translate(screenX, screenY);

          const shellMainColor = k.isBlue ? '#0088cc' : '#00b020';
          const shellPatternColor = k.isBlue ? '#003366' : '#004d10';
          const shellHighlight = k.isBlue ? '#40c8ff' : '#45e850';

          if (k.inShell) {
            // Shell mode with 3D spherical shading and spin blur
            ctx.save();
            if (k.sliding) {
              const wobble = Math.sin(Date.now() / 30) * 2;
              ctx.translate(0, wobble);
            }

            // Shell shadow outline
            ctx.fillStyle = shellPatternColor;
            ctx.beginPath();
            ctx.ellipse(k.w / 2, k.h / 2, k.w / 2, k.h / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Shell dome
            ctx.fillStyle = shellMainColor;
            ctx.beginPath();
            ctx.ellipse(k.w / 2, k.h / 2 - 1, k.w / 2 - 2, k.h / 2 - 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Top specular shine
            ctx.fillStyle = shellHighlight;
            ctx.beginPath();
            ctx.ellipse(k.w / 2 - 2, k.h / 2 - 5, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hexagonal shell plates
            ctx.strokeStyle = shellPatternColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(6, 6, k.w - 12, k.h - 12);

            // Heavy white rim plate
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(2, k.h - 7, k.w - 4, 5);
            ctx.fillStyle = '#b0b0b0';
            ctx.fillRect(2, k.h - 2, k.w - 4, 1); // rim shadow

            ctx.restore();
            ctx.restore();
            return;
          }

          // Full Walking Koopa Troopa
          const facing = k.vx >= 0 ? 1 : -1;
          ctx.translate(k.w / 2, 0);
          ctx.scale(facing, 1);
          ctx.translate(-k.w / 2, 0);

          // 1. SHELL ON BACK (shaded dome with white rim)
          ctx.fillStyle = shellPatternColor;
          ctx.beginPath();
          ctx.arc(8, 19, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = shellMainColor;
          ctx.beginPath();
          ctx.arc(8, 18, 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = shellHighlight;
          ctx.beginPath();
          ctx.arc(6, 15, 4, 0, Math.PI * 2);
          ctx.fill();

          // White scalloped rim
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 24, 16, 5);
          ctx.fillStyle = '#a0a0a0';
          ctx.fillRect(0, 28, 16, 1);

          // 2. YELLOW HEAD & PROMINENT BEAK
          ctx.fillStyle = '#d48800'; // head shadow
          ctx.beginPath();
          ctx.ellipse(18, 12, 9, 9, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffcc00'; // yellow head
          ctx.beginPath();
          ctx.ellipse(18, 11, 8, 8, 0, 0, Math.PI * 2);
          ctx.fill();

          // Beak nose profile
          ctx.fillStyle = '#ffe066';
          ctx.fillRect(21, 10, 4, 4);

          // Cartoon Eye with glint
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(16, 6, 6, 8);
          ctx.fillStyle = '#000000';
          ctx.fillRect(18, 7, 3, 5);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(18, 7, 1, 2);

          // 3. ORANGE WEBBED SHOES WITH SOLE
          const step = Math.sin(k.animTimer) > 0;
          ctx.fillStyle = '#c05000'; // shoe shadow
          ctx.fillRect(2, 33, 10, 2);
          ctx.fillRect(12, 33, 10, 2);

          ctx.fillStyle = '#ff8800'; // shoe top
          if (step) {
            ctx.fillRect(2, 27, 9, 6);
            ctx.fillRect(13, 26, 8, 7);
            ctx.fillStyle = '#ffa533';
            ctx.fillRect(3, 27, 4, 2);
          } else {
            ctx.fillRect(3, 26, 8, 7);
            ctx.fillRect(12, 27, 9, 6);
            ctx.fillStyle = '#ffa533';
            ctx.fillRect(13, 27, 4, 2);
          }

          ctx.restore();
        }

        function drawBowser(b, camX) {
          if (!b) return;
          const screenX = Math.round(b.x - camX);
          const screenY = Math.round(b.y);

          if (screenX + b.w < -60 || screenX > VIEW_WIDTH + 60) return;

          ctx.save();
          ctx.translate(screenX + b.w / 2, screenY + b.h / 2);

          if (b.defeated) {
            ctx.rotate(Math.PI); // Flipped upside down!
          }

          // 1. MASSIVE SPIKY CARAPACE SHELL (textured with 3D shaded plates)
          ctx.fillStyle = '#0d4a13';
          ctx.beginPath();
          ctx.arc(4, 0, 26, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#1c8c24';
          ctx.beginPath();
          ctx.arc(4, -1, 23, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#3ee04c';
          ctx.beginPath();
          ctx.arc(2, -4, 10, 0, Math.PI * 2);
          ctx.fill();

          // White spikes with blood-orange warning rings
          ctx.fillStyle = '#d01010';
          ctx.fillRect(10, -26, 8, 5);
          ctx.fillRect(-16, -24, 8, 5);
          ctx.fillRect(-22, 0, 6, 6);

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(8, -24); ctx.lineTo(14, -38); ctx.lineTo(20, -22); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-10, -20); ctx.lineTo(-18, -34); ctx.lineTo(-4, -20); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-20, 2); ctx.lineTo(-36, -2); ctx.lineTo(-20, 14); ctx.fill();

          // 2. SCALY YELLOW BODY & UNDERBELLY WITH RIBS
          ctx.fillStyle = '#b87800';
          ctx.beginPath();
          ctx.ellipse(-10, 4, 16, 19, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffb800';
          ctx.beginPath();
          ctx.ellipse(-10, 4, 14, 17, 0, 0, Math.PI * 2);
          ctx.fill();

          // Belly plate ribs
          ctx.fillStyle = '#d48800';
          ctx.fillRect(-22, -3, 18, 3);
          ctx.fillRect(-22, 5, 18, 3);
          ctx.fillRect(-20, 13, 14, 2);

          // 3. RED FLAMING MANE & HAIR TUFTS
          ctx.fillStyle = '#990000';
          ctx.fillRect(-26, -30, 17, 15);
          ctx.fillStyle = '#ff2200';
          ctx.fillRect(-24, -28, 14, 12);
          ctx.fillStyle = '#ff7700';
          ctx.fillRect(-22, -26, 8, 6); // hair shine

          // 4. DRAGON HEAD, SNOUT & HORNS
          ctx.fillStyle = '#146419';
          ctx.beginPath();
          ctx.ellipse(-20, -14, 13, 11, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#229e2c';
          ctx.beginPath();
          ctx.ellipse(-20, -14, 11, 9, 0, 0, Math.PI * 2);
          ctx.fill();

          // Snout
          ctx.fillStyle = '#ffb800';
          ctx.fillRect(-29, -15, 15, 9);
          ctx.fillStyle = '#ffa000';
          ctx.fillRect(-29, -6, 15, 2);

          // Curved Horns with ivory shine
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(-15, -24); ctx.lineTo(-10, -40); ctx.lineTo(-5, -24); ctx.fill();
          ctx.fillStyle = '#cccccc';
          ctx.beginPath();
          ctx.moveTo(-10, -40); ctx.lineTo(-5, -24); ctx.lineTo(-8, -24); ctx.fill();

          // Piercing glowing yellow eyes with red irises
          ctx.fillStyle = '#ff0000';
          ctx.fillRect(-23, -19, 7, 6);
          ctx.fillStyle = '#ffff00';
          ctx.fillRect(-22, -18, 5, 4);
          ctx.fillStyle = '#000000';
          ctx.fillRect(-24, -17, 2, 3);

          // Menacing Fangs
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(-28, -10); ctx.lineTo(-26, -4); ctx.lineTo(-24, -10); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-22, -10); ctx.lineTo(-20, -4); ctx.lineTo(-18, -10); ctx.fill();

          // 5. HEAVY CLAWS & DRAGON FEET
          const footStep = Math.sin(b.animTimer) > 0;
          ctx.fillStyle = '#146419';
          ctx.fillRect(-19, 17 + (footStep ? -2 : 0), 14, 12);
          ctx.fillRect(3, 17 + (footStep ? 0 : -2), 14, 12);

          ctx.fillStyle = '#229e2c';
          ctx.fillRect(-18, 18 + (footStep ? -2 : 0), 12, 10);
          ctx.fillRect(4, 18 + (footStep ? 0 : -2), 12, 10);

          // Sharp white razor claws
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-21, 24, 3, 5);
          ctx.fillRect(-17, 24, 3, 5);
          ctx.fillRect(1, 24, 3, 5);
          ctx.fillRect(5, 24, 3, 5);

          // Breathing Fire Glow effect in throat
          if (b.fireTimer < 0.45) {
            const glowR = 10 + Math.random() * 6;
            ctx.fillStyle = '#ff4400';
            ctx.beginPath();
            ctx.arc(-33, -10, glowR, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffff33';
            ctx.beginPath();
            ctx.arc(-33, -10, glowR * 0.5, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        function drawBossFireball(fb, camX) {
          const screenX = Math.round(fb.x - camX);
          const screenY = Math.round(fb.y);

          if (screenX < -40 || screenX > VIEW_WIDTH + 40) return;

          ctx.save();
          ctx.translate(screenX, screenY);

          // Flaming spinning breath
          const rot = fb.animTimer;
          ctx.translate(fb.w / 2, fb.h / 2);
          ctx.rotate(rot);

          // Outer flame
          ctx.fillStyle = '#ff2200';
          ctx.beginPath();
          ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
          ctx.fill();

          // Flame lobes
          ctx.fillStyle = '#ff8800';
          ctx.fillRect(-10, -6, 20, 12);

          // Hot yellow core
          ctx.fillStyle = '#ffff55';
          ctx.beginPath();
          ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // White center
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-3, -2, 6, 4);

          ctx.restore();
        }

        function drawMushroomItem(m, camX) {
          const screenX = Math.round(m.x - camX);
          const screenY = Math.round(m.y);

          ctx.save();
          ctx.translate(screenX, screenY);

          // Red dome cap
          ctx.fillStyle = '#e52521';
          ctx.beginPath();
          ctx.arc(12, 12, 12, Math.PI, 0);
          ctx.fill();

          // White polka dots
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(12, 6, 4, 0, Math.PI * 2);
          ctx.arc(4, 11, 3, 0, Math.PI * 2);
          ctx.arc(20, 11, 3, 0, Math.PI * 2);
          ctx.fill();

          // Stem
          ctx.fillStyle = '#fce4a0';
          ctx.fillRect(5, 12, 14, 11);

          // Eyes
          ctx.fillStyle = '#000';
          ctx.fillRect(7, 14, 2, 4);
          ctx.fillRect(15, 14, 2, 4);

          ctx.restore();
        }

        function drawCoin(c, camX) {
          const screenX = Math.round(c.x - camX);
          const screenY = Math.round(c.y);

          if (screenX < -20 || screenX > VIEW_WIDTH + 20) return;

          // 3D spinning coin effect
          const scale = Math.abs(Math.sin(c.animTimer));
          const w = Math.max(3, 14 * scale);

          ctx.save();
          ctx.translate(screenX + 10, screenY + 12);

          ctx.fillStyle = '#b8860b';
          ctx.beginPath();
          ctx.ellipse(0, 0, w / 2 + 1, 11, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.ellipse(0, 0, w / 2, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          // Center shine bar
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-w / 4, -6, Math.max(1, w / 2), 12);

          ctx.restore();
        }

        function drawFlagpoleAndCastle(camX) {
          // --- FLAGPOLE ---
          const poleX = Math.round(flagpole.x - camX);
          if (poleX >= -60 && poleX <= VIEW_WIDTH + 60) {
            // Pole steps
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(poleX - 16, flagpole.baseY, 32, 32);
            ctx.strokeStyle = '#401800';
            ctx.strokeRect(poleX - 16, flagpole.baseY, 32, 32);

            // Pole rod
            ctx.fillStyle = '#dcdcdc';
            ctx.fillRect(poleX - 3, flagpole.topY, 6, flagpole.baseY - flagpole.topY);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(poleX - 2, flagpole.topY, 2, flagpole.baseY - flagpole.topY);

            // Golden Finial Ball at top
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(poleX, flagpole.topY, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#b8860b';
            ctx.stroke();

            // Flag
            const flagY = Math.round(flagpole.flagY);
            ctx.fillStyle = '#00a800';
            ctx.beginPath();
            ctx.moveTo(poleX - 3, flagY);
            ctx.lineTo(poleX - 35, flagY + 14);
            ctx.lineTo(poleX - 3, flagY + 28);
            ctx.fill();
            ctx.fillStyle = '#80d010';
            ctx.fillRect(poleX - 18, flagY + 8, 8, 12);
          }

          // --- VICTORY CASTLE ---
          const castleX = Math.round(castle.x - camX);
          if (castleX >= -200 && castleX <= VIEW_WIDTH + 200) {
            // Main castle brick wall
            ctx.fillStyle = '#b85418';
            ctx.fillRect(castleX, castle.y, castle.w, castle.h);

            // Brick lines
            ctx.fillStyle = '#602000';
            for (let cy = castle.y; cy < castle.y + castle.h; cy += 16) {
              ctx.fillRect(castleX, cy, castle.w, 2);
            }

            // Battlements / Crenellations
            for (let bx = castleX; bx < castleX + castle.w; bx += 32) {
              ctx.fillRect(bx, castle.y - 18, 20, 18);
              ctx.fillStyle = '#fce4a0';
              ctx.fillRect(bx + 2, castle.y - 16, 16, 3);
              ctx.fillStyle = '#602000';
            }

            // Entrance Door Archway
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(castleX + castle.w / 2, castle.y + castle.h - castle.doorH, castle.doorW / 2, Math.PI, 0);
            ctx.rect(castleX + castle.w / 2 - castle.doorW / 2, castle.y + castle.h - castle.doorH, castle.doorW, castle.doorH);
            ctx.fill();

            // Castle Flag
            const cfX = castleX + castle.w / 2;
            const cfY = castle.flagRaised ? castle.y - 45 : castle.y - 20;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cfX - 1, cfY, 3, 25);
            ctx.fillStyle = '#e52521';
            ctx.fillRect(cfX + 2, cfY, 18, 12);
          }
        }

        function drawHUD() {
          ctx.save();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px "Courier New", Courier, monospace';
          ctx.shadowColor = '#000';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;

          // MARIO & Score
          ctx.fillText('MARIO', 40, 24);
          ctx.fillText(score.toString().padStart(6, '0'), 40, 42);

          // Coins
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(225, 36, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`× ${coins.toString().padStart(2, '0')}`, 238, 42);

          // WORLD
          ctx.fillText('WORLD', 400, 24);
          const stageInfo = STAGE_NAMES[currentStage] || { num: '1-1', title: 'OVERWORLD' };
          ctx.fillText(stageInfo.num, 412, 42);

          // TIME
          ctx.fillText('TIME', 570, 24);
          const displayTime = Math.max(0, Math.floor(levelTime));
          ctx.fillText(displayTime.toString().padStart(3, '0'), 578, 42);

          // LIVES
          ctx.fillText('LIVES', 700, 24);
          ctx.fillText(`♥ × ${lives}`, 700, 42);

          ctx.restore();
        }

        function drawOverlays() {
          if (currentState === GameState.STAGE_CARD) {
            // Authentic Black Interstitial Stage Card
            ctx.fillStyle = '#0a0d16';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            const stageInfo = STAGE_NAMES[currentStage] || { num: '1-1', title: 'STAGE' };

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`WORLD ${stageInfo.num}`, VIEW_WIDTH / 2, 180);

            ctx.fillStyle = '#fc9838';
            ctx.font = 'bold 20px "Courier New", Courier, monospace';
            ctx.fillText(stageInfo.title, VIEW_WIDTH / 2, 222);

            // Human hero face and lives counter
            const hfX = VIEW_WIDTH / 2 - 40;
            const hfY = 262;
            // Cap
            ctx.fillStyle = '#e52521';
            ctx.fillRect(hfX, hfY, 18, 7);
            ctx.fillRect(hfX + 4, hfY + 5, 16, 3); // visor
            // Hair & Face
            ctx.fillStyle = '#54260d';
            ctx.fillRect(hfX - 2, hfY + 6, 5, 10);
            ctx.fillStyle = '#fedac0';
            ctx.fillRect(hfX + 3, hfY + 7, 14, 11);
            // Rosy cheek & human eye
            ctx.fillStyle = '#fcaaa0';
            ctx.fillRect(hfX + 6, hfY + 12, 4, 3);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(hfX + 9, hfY + 9, 4, 3);
            ctx.fillStyle = '#0a3d82';
            ctx.fillRect(hfX + 11, hfY + 9, 2, 3);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(hfX + 10, hfY + 9, 1, 1);
            // Nose & Lips
            ctx.fillStyle = '#d8946e';
            ctx.fillRect(hfX + 14, hfY + 11, 3, 2);
            ctx.fillStyle = '#c85e54';
            ctx.fillRect(hfX + 10, hfY + 14, 4, 2);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px "Courier New", Courier, monospace';
            ctx.fillText(`×  ${lives}`, VIEW_WIDTH / 2 + 16, 278);

            // Helpful tips
            ctx.fillStyle = '#8898b8';
            ctx.font = '14px "Courier New", Courier, monospace';
            if (currentStage === 1) {
              ctx.fillText('Tip: Double-tap Space for Super Double Jump! Hold Space for High Jump.', VIEW_WIDTH / 2, 360);
            } else if (currentStage === 2) {
              ctx.fillText('Tip: Watch out for underground Koopas! Kick their shells to wipe out lines of enemies.', VIEW_WIDTH / 2, 360);
            } else if (currentStage === 3) {
              ctx.fillText("Tip: Leap across the lava moat, dodge Bowser's flames, and touch the Axe switch!", VIEW_WIDTH / 2, 360);
            }
            return;
          }

          if (currentState === GameState.START) {
            // Dark vignette
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // Title Banner Box
            ctx.fillStyle = 'rgba(15, 20, 35, 0.92)';
            ctx.strokeStyle = '#fc9838';
            ctx.lineWidth = 4;
            roundRect(ctx, 100, 70, 600, 340, 16, true, true);

            // Game Title
            ctx.fillStyle = '#fc9838';
            ctx.font = 'bold 36px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;
            ctx.fillText('SUPER RETRO', VIEW_WIDTH / 2, 130);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Courier New", Courier, monospace';
            ctx.fillText('PLATFORMER BROS', VIEW_WIDTH / 2, 172);

            // Start Prompt (Pulsing)
            const pulse = Math.floor(Date.now() / 400) % 2 === 0;
            ctx.fillStyle = pulse ? '#ffea00' : '#ffffff';
            ctx.font = 'bold 20px "Courier New", Courier, monospace';
            ctx.fillText('PRESS SPACE OR CLICK TO PLAY', VIEW_WIDTH / 2, 230);

            // Controls Guide
            ctx.fillStyle = '#a0b0d0';
            ctx.font = '14px "Courier New", Courier, monospace';
            ctx.fillText('🎮 CONTROLS:', VIEW_WIDTH / 2, 275);
            ctx.fillText('A / D  or  ARROWS : Move Left / Right', VIEW_WIDTH / 2, 298);
            ctx.fillText('SPACE / W : High Jump (Hold Space for Max Height | Double Tap: Super Double Jump!)', VIEW_WIDTH / 2, 321);
            ctx.fillText('SHIFT / B : Run Sprint  |  P : Pause', VIEW_WIDTH / 2, 344);

            if (highScore > 0) {
              ctx.fillStyle = '#ffd700';
              ctx.font = 'bold 15px "Courier New", Courier, monospace';
              ctx.fillText(`🏆 TOP RECORD: ${highScore.toString().padStart(6, '0')}`, VIEW_WIDTH / 2, 390);
            }
          } else if (currentState === GameState.PAUSED) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME PAUSED', VIEW_WIDTH / 2, 220);

            ctx.font = '18px "Courier New", Courier, monospace';
            ctx.fillText('PRESS P OR ESC TO RESUME', VIEW_WIDTH / 2, 270);
          } else if (currentState === GameState.GAMEOVER) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            ctx.fillStyle = '#e52521';
            ctx.font = 'bold 44px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', VIEW_WIDTH / 2, 190);

            ctx.fillStyle = '#ffffff';
            ctx.font = '22px "Courier New", Courier, monospace';
            ctx.fillText(`FINAL SCORE: ${score.toString().padStart(6, '0')}`, VIEW_WIDTH / 2, 250);

            if (score > highScore) {
              highScore = score;
              localStorage.setItem('retro_mario_highscore', highScore.toString());
              ctx.fillStyle = '#ffd700';
              ctx.fillText('⭐ NEW RECORD HIGH SCORE! ⭐', VIEW_WIDTH / 2, 290);
            }

            const pulse = Math.floor(Date.now() / 400) % 2 === 0;
            ctx.fillStyle = pulse ? '#ffea00' : '#ffffff';
            ctx.font = 'bold 18px "Courier New", Courier, monospace';
            ctx.fillText('PRESS SPACE OR CLICK TO TRY AGAIN', VIEW_WIDTH / 2, 340);
          } else if (currentState === GameState.VICTORY) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

            // Victory banner
            ctx.fillStyle = 'rgba(20, 24, 38, 0.9)';
            ctx.strokeStyle = '#48c080';
            ctx.lineWidth = 4;
            roundRect(ctx, 120, 90, 560, 300, 16, true, true);

            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 36px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('STAGE CLEAR!', VIEW_WIDTH / 2, 155);

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px "Courier New", Courier, monospace';
            ctx.fillText('THANK YOU FOR PLAYING!', VIEW_WIDTH / 2, 205);
            ctx.fillText(`TOTAL SCORE: ${score.toString().padStart(6, '0')}`, VIEW_WIDTH / 2, 245);
            ctx.fillText(`COINS COLLECTED: ${coins}`, VIEW_WIDTH / 2, 280);

            if (score > highScore) {
              highScore = score;
              localStorage.setItem('retro_mario_highscore', highScore.toString());
              ctx.fillStyle = '#ffd700';
              ctx.fillText('⭐ NEW ALL-TIME RECORD! ⭐', VIEW_WIDTH / 2, 315);
            }

            const pulse = Math.floor(Date.now() / 400) % 2 === 0;
            ctx.fillStyle = pulse ? '#ffea00' : '#ffffff';
            ctx.font = 'bold 18px "Courier New", Courier, monospace';
            ctx.fillText('PRESS SPACE OR CLICK TO PLAY AGAIN', VIEW_WIDTH / 2, 355);
          }
        }

        function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.lineTo(x + width - radius, y);
          ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
          ctx.lineTo(x + width, y + height - radius);
          ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
          ctx.lineTo(x + radius, y + height);
          ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
          ctx.lineTo(x, y + radius);
          ctx.quadraticCurveTo(x, y, x + radius, y);
          ctx.closePath();
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        // --- AXE SWITCH & VICTORY SEQUENCE LOGIC ---
        function triggerAxeSwitch() {
          if (!axeBlock) return;
          Sound.breakBrick();
          score += 2000;
          addFloatingText(axeBlock.x, axeBlock.y - 24, 'AXE CUT! 2000', '#ffd700');

          // Remove axe block
          const axeIdx = blocks.indexOf(axeBlock);
          if (axeIdx !== -1) blocks.splice(axeIdx, 1);
          axeBlock = null;

          // Collapse the drawbridge blocks sequentially with brick particles
          const bridgeBlocks = blocks.filter(b => b.type === BlockType.BRIDGE);
          bridgeBlocks.forEach((bridgeBlock, i) => {
            setTimeout(() => {
              createBrickDebris(bridgeBlock.x + 16, bridgeBlock.y + 16);
              bridgeBlock.solid = false;
              bridgeBlock.y += 1000;
              Sound.bump();
            }, i * 65);
          });

          // Bowser plunges into the lava moat!
          if (bowser && !bowser.defeated) {
            setTimeout(() => {
              if (bowser) bowser.defeat();
            }, 300);
          }
        }

        function triggerVictory() {
          currentState = GameState.VICTORY_SLIDE;
          flagpole.reached = true;
          player.vx = 0;
          player.vy = 0;
          player.x = flagpole.x - player.w / 2;
          Sound.victory();
          score += 1000;
          addFloatingText(flagpole.x, player.y, '1000', '#ffff00');
        }

        function updateVictory(dt) {
          if (currentState === GameState.VICTORY_SLIDE) {
            // Slide down pole
            if (flagpole.flagY < flagpole.baseY - 32) {
              flagpole.flagY += 150 * dt;
            }
            if (player.y < flagpole.baseY - player.h) {
              player.y += 140 * dt;
            } else {
              // Reached bottom of pole
              player.y = flagpole.baseY - player.h;
              player.x = flagpole.x + 16;
              currentState = GameState.VICTORY_WALK;
            }
          } else if (currentState === GameState.VICTORY_WALK) {
            // Player walks to the castle
            player.facing = 1;
            player.x += 100 * dt;
            player.animTimer += dt * 10;
            player.walkFrame = Math.floor(player.animTimer) % 3;

            // Arrive at castle door
            if (player.x >= castle.x + castle.w / 2 - 8) {
              castle.flagRaised = true;
              // Calculate Time Bonus
              if (!victoryBonusCalculated) {
                victoryBonusCalculated = true;
                const timeBonus = Math.floor(levelTime) * 50;
                score += timeBonus;
                addFloatingText(castle.x + castle.w / 2, castle.y - 10, `+${timeBonus} TIME BONUS!`, '#ffff55');
              }
              victoryTimer += dt;
              // Launch fireworks
              if (Math.random() < 0.25) {
                createFirework(castle.x + Math.random() * castle.w, castle.y - 30 - Math.random() * 80);
              }
              if (victoryTimer > 2.8) {
                if (currentStage < TOTAL_STAGES) {
                  startStage(currentStage + 1);
                } else {
                  currentState = GameState.VICTORY;
                }
              }
            }
          }
        }

        function createFirework(x, y) {
          const colors = ['#ff4444', '#ffea00', '#44ff44', '#44aaff', '#ffffff'];
          const col = colors[Math.floor(Math.random() * colors.length)];
          for (let i = 0; i < 16; i++) {
            const angle = (Math.PI * 2 / 16) * i;
            const spd = 60 + Math.random() * 80;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd,
              color: col,
              alpha: 1.0,
              update: function(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= 1.4 * dt;
              }
            });
          }
        }

        // --- MAIN GAME LOOP ---
        let lastTime = performance.now();

        function gameLoop(now) {
          const dt = Math.min((now - lastTime) / 1000, 0.05); // Cap to 50ms to prevent collision tunneling
          lastTime = now;

          // 1. UPDATE STATE
          if (currentState === GameState.STAGE_CARD) {
            stageCardTimer -= dt;
            if (stageCardTimer <= 0) {
              currentState = GameState.PLAYING;
            }
          } else if (currentState === GameState.PLAYING) {
            // Level Timer
            timeTimer += dt;
            if (timeTimer >= 0.4) {
              timeTimer = 0;
              levelTime -= 1;
              if (levelTime <= 0) {
                player.die();
              }
            }

            // Update Player
            player.update(dt);

            // Update Camera (Smooth tracking forward)
            const targetCamX = player.x - 240;
            if (targetCamX > cameraX) {
              cameraX = targetCamX;
            }
            // Clamp camera to level bounds
            cameraX = Math.max(0, Math.min(LEVEL_WIDTH - VIEW_WIDTH, cameraX));

            // Check Flagpole collision
            if (!flagpole.reached && player.x + player.w >= flagpole.x - 6 && player.x <= flagpole.x + 10) {
              triggerVictory();
            }

            // Update Blocks
            blocks.forEach(b => b.update(dt));

            // Update Enemies & Interactions
            enemies.forEach(e => {
              e.update(dt);

              if (e.alive && checkAABB(player, e)) {
                if (e instanceof Koopa && e.inShell && !e.sliding) {
                  e.stomp(player.facing);
                  player.invincibleTimer = 0.2;
                } else {
                  const isFalling = player.vy > 0;
                  const playerFeet = player.y + player.h;
                  const enemyHead = e.y + (e instanceof Koopa && e.inShell ? 8 : 14);

                  if (isFalling && playerFeet <= enemyHead + 10) {
                    e.stomp(player.facing);
                    // Stomp bounce (high bounce if jump button is held!)
                    player.vy = keys.jumpHeld ? -550 : -380;
                    player.y = e.y - player.h;
                    player.jumpCount = 1; // Allow double jump after stomp
                  } else {
                    player.takeDamage();
                  }
                }
              }
            });

            // Filter out dead squashed enemies after lingering
            enemies = enemies.filter(e => e.alive || e.squashedTimer > 0);

            // Update Bowser Boss
            if (bowser) {
              bowser.update(dt);
              if (bowser.alive && !bowser.defeated && checkAABB(player, bowser)) {
                const isFalling = player.vy > 0;
                const playerFeet = player.y + player.h;
                if (isFalling && playerFeet <= bowser.y + 24) {
                  player.vy = -450;
                  player.takeDamage();
                } else {
                  player.takeDamage();
                }
              }
            }

            // Update Boss Fireballs
            bossFireballs.forEach(fb => {
              fb.update(dt);
              if (fb.alive && checkAABB(player, fb)) {
                player.takeDamage();
                fb.alive = false;
                createDust(fb.x, fb.y);
              }
            });
            bossFireballs = bossFireballs.filter(fb => fb.alive);

            // Update Items (Mushrooms)
            items.forEach(m => {
              m.update(dt);
              if (m.alive && checkAABB(player, m)) {
                m.alive = false;
                player.makeSuper();
              }
            });
            items = items.filter(m => m.alive);

            // Update Floating Coins
            coinsList.forEach(c => {
              c.update(dt);
              if (!c.collected && checkAABB(player, c)) {
                c.collected = true;
                Sound.coin();
                coins++;
                score += 100;
                addFloatingText(c.x + 4, c.y - 10, '100', '#ffd700');
                // 100 coins = 1-UP!
                if (coins >= 100) {
                  coins = 0;
                  lives++;
                  Sound.powerup();
                  addFloatingText(player.x, player.y - 20, '1-UP!', '#44ff44');
                }
              }
            });
            coinsList = coinsList.filter(c => !c.collected);
          } else if (currentState === GameState.DYING) {
            // Player death hop animation
            player.dyingTimer -= dt;
            player.vy += GRAVITY * dt * 0.9;
            player.y += player.vy * dt;

            if (player.dyingTimer <= 0) {
              if (lives > 0) {
                // Respawn at beginning
                player.reset(80, GROUND_Y - 40);
                cameraX = 0;
                currentState = GameState.PLAYING;
              } else {
                currentState = GameState.GAMEOVER;
              }
            }
          } else if (currentState === GameState.VICTORY_SLIDE || currentState === GameState.VICTORY_WALK) {
            updateVictory(dt);
          }

          // Update Sky Aeroplanes & Birds
          skyPlanes.forEach(p => p.update(dt));
          skyBirds.forEach(b => b.update(dt));

          // Update Particles & Floating Text
          particles.forEach(p => p.update(dt));
          particles = particles.filter(p => (p.life === undefined || p.life > 0) && (p.alpha === undefined || p.alpha > 0));

          floatingTexts.forEach(t => t.update(dt));
          floatingTexts = floatingTexts.filter(t => t.alpha > 0);

          // 2. RENDER SCENE
          ctx.clearRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

          // Background sky & landscape
          drawBackground(cameraX);

          // Sky Aeroplane & Birds
          skyPlanes.forEach(plane => drawAeroplane(plane, cameraX));
          skyBirds.forEach(bird => drawSkyBird(bird, cameraX));

          // Blocks & Pipes
          blocks.forEach(b => drawBlock(b, cameraX));

          // Collectible coins
          coinsList.forEach(c => drawCoin(c, cameraX));

          // Flagpole and Victory Castle
          drawFlagpoleAndCastle(cameraX);

          // Items (Super Mushrooms)
          items.forEach(m => drawMushroomItem(m, cameraX));

          // Enemies
          enemies.forEach(e => {
            if (e instanceof Koopa) {
              drawKoopa(e, cameraX);
            } else {
              drawGoomba(e, cameraX);
            }
          });

          // Bowser Boss
          if (bowser) {
            drawBowser(bowser, cameraX);
          }

          // Boss Fireballs
          bossFireballs.forEach(fb => drawBossFireball(fb, cameraX));

          // Player
          if (currentState !== GameState.VICTORY_WALK || player.x < castle.x + castle.w / 2) {
            drawPlayer(player, cameraX);
          }

          // Particles
          particles.forEach(p => {
            ctx.save();
            if (p instanceof BrickParticle) {
              ctx.translate(p.x - cameraX, p.y);
              ctx.rotate(p.rotation);
              ctx.fillStyle = '#b84418';
              ctx.fillRect(-6, -6, 12, 12);
            } else if (p instanceof BounceCoin) {
              const scale = Math.abs(Math.sin(p.animTimer));
              ctx.globalAlpha = Math.max(0, p.alpha);
              ctx.fillStyle = '#ffd700';
              ctx.beginPath();
              ctx.ellipse(p.x - cameraX, p.y, Math.max(2, 8 * scale), 12, 0, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.r) {
              // Dust puff
              ctx.globalAlpha = Math.max(0, p.alpha);
              ctx.fillStyle = '#e8d8b8';
              ctx.beginPath();
              ctx.arc(p.x - cameraX, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.color) {
              // Firework particle
              ctx.globalAlpha = Math.max(0, p.alpha);
              ctx.fillStyle = p.color;
              ctx.fillRect(p.x - cameraX, p.y, 4, 4);
            }
            ctx.restore();
          });

          // Floating Score Texts
          floatingTexts.forEach(t => {
            ctx.save();
            ctx.globalAlpha = Math.max(0, t.alpha);
            ctx.fillStyle = t.color;
            ctx.font = 'bold 14px "Courier New", Courier, monospace';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 1;
            ctx.fillText(t.text, Math.round(t.x - cameraX), Math.round(t.y));
            ctx.restore();
          });

          // Retro HUD Header
          drawHUD();

          // UI Overlays (Start, Pause, Game Over, Stage Clear)
          drawOverlays();

          requestAnimationFrame(gameLoop);
        }

        // Start 60 FPS animation loop
        requestAnimationFrame(gameLoop);

      })();
    </script>
  </body>
</html>
